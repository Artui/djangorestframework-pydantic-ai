[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djangorestframework-pydantic-ai"
dynamic = ["version"]
description = "Expose djangorestframework-services services and selectors as a Pydantic-AI toolset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Artur Veres", email = "artur8118@gmail.com" },
]
keywords = ["django", "drf", "rest-framework", "pydantic-ai", "agent", "ai", "llm", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    # 0.36 floor: ``dispatch_spec(filter_data=…)`` reaches the *read* path, which
    # is how a filter-owned ``ordering`` gets to the FilterSet without also
    # landing in the selector callable's kwarg pool. The band also carries
    # ``preconditions`` (0.34), ``AdditionalInputRequired`` (0.32), the
    # ``progress`` pool seed (0.30) and consumer-owned spec ``metadata`` (0.31).
    "djangorestframework-services>=0.43",
    "pydantic-ai-slim>=2,<3",
]

[project.optional-dependencies]
# A filtered list selector's input schema (``spec.filter_set``) is generated by
# drf-services, which lazy-loads django-filter. Only needed if your selectors
# declare a ``filter_set``.
filter = ["django-filter>=23"]

[project.urls]
Homepage = "https://github.com/Artui/djangorestframework-pydantic-ai"
Repository = "https://github.com/Artui/djangorestframework-pydantic-ai"
Issues = "https://github.com/Artui/djangorestframework-pydantic-ai/issues"

[tool.hatch.version]
path = "rest_framework_pydantic_ai/version.py"
pattern = "^__version__(?:\\s*:\\s*[A-Za-z][A-Za-z0-9_]*)?\\s*=\\s*[\"'](?P<version>[^\"']+)[\"']"

[tool.hatch.build.targets.wheel]
packages = ["rest_framework_pydantic_ai"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.32",
    "pre-commit>=3.8.0",
    "pytest>=8.0",
    "pytest-django>=4.11.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "flake8-tidy-imports>=4.12.0",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
    "django-filter>=23",
    "pydantic-ai-slim>=2,<3",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.conftest_settings"
asyncio_mode = "auto"
addopts = "--cov=rest_framework_pydantic_ai --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["rest_framework_pydantic_ai"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "TID"]
ignore = [
    "E203",
    "E501",
    "E231",
    "F811",
    "E722",
    "E741",
    # PEP 695 syntax. The package uses ``TypeVar`` + ``Generic[T]``; without
    # these three, ``ruff --fix`` rewrites code *into* the syntax CLAUDE.md
    # forbids.
    "UP040",
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
# I002 exempts the two file kinds that must not carry the future import: a
# re-export ``__init__.py`` has no annotations to postpone, and migrations are
# generated by Django, so the import would be dropped on every makemigrations.
"__init__.py" = ["F401", "I002"]
"**/migrations/*.py" = ["I002"]

[tool.ruff.lint.isort]
known-first-party = ["rest_framework_pydantic_ai"]
# CLAUDE.md requires this at the top of every annotated file; required-imports
# is what enforces it rather than leaving it to memory.
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
# CLAUDE.md forbids every relative form, including single-dot. TID's default is
# "parents", which lets ``from .foo import bar`` through.
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
root = ["./rest_framework_pydantic_ai"]

# bump-my-version drives `make release-bump` — it rewrites the version in
# rest_framework_pydantic_ai/version.py and promotes the CHANGELOG [Unreleased] block under
# a new dated heading. Run via `uvx bump-my-version` (no permanent dependency).
[tool.bumpversion]
current_version = "0.18.1"
allow_dirty = false
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "rest_framework_pydantic_ai/version.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = """## [Unreleased]

## [{new_version}] — {now:%Y-%m-%d}"""

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "[Unreleased]: https://github.com/Artui/djangorestframework-pydantic-ai/compare/v{current_version}...HEAD"
replace = """[Unreleased]: https://github.com/Artui/djangorestframework-pydantic-ai/compare/v{new_version}...HEAD
[{new_version}]: https://github.com/Artui/djangorestframework-pydantic-ai/compare/v{current_version}...v{new_version}"""
